name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx eslint .
      - run: npx jest
      # Transactions need a replica set; `services:` cannot pass a command to the container
      - name: Start MongoDB replica set
        run: |
          docker run -d --name veltra-mongo -p 27017:27017 mongo:7 --replSet rs0
          timeout 60 bash -c "until docker exec veltra-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' > /dev/null 2>&1; do sleep 1; done"
          docker exec veltra-mongo mongosh --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          timeout 60 bash -c "until docker exec veltra-mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; do sleep 1; done"
      - run: npx jest --config ./test/jest-e2e.json test/realtime-redis-adapter.e2e-spec.ts test/session-rotation.e2e-spec.ts test/direct-conversation.e2e-spec.ts test/message-transactions.e2e-spec.ts test/friend-request.e2e-spec.ts test/user-search.e2e-spec.ts test/message-reactions.e2e-spec.ts test/seen-receipts.e2e-spec.ts
        env:
          REDIS_URL: redis://127.0.0.1:6379
          MONGODB_URL: mongodb://127.0.0.1:27017/?directConnection=true
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.tiendat75.id.vn
